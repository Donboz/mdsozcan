<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anneler Günü Manimatik</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 520px;
            width: 92%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            margin-top: 0;
            font-size: 2rem;
        }

        p.aciklama {
            color: #666;
            margin-bottom: 16px;
        }

        p.link {
            margin-top: 0;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 14px;
        }

        input[type="text"]:focus {
            border-color: #f5576c;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #f5576c;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #dc3f5a;
            transform: translateY(-2px);
        }

        #sonucKutusu {
            margin-top: 20px;
            background-color: #fff0f5;
            padding: 18px;
            border-radius: 10px;
            border-left: 5px solid #f5576c;
            color: #2c3e50;
            font-size: 18px;

</head>
<body>
    <div class="container">
        <h1>🌸 Anneler Günü Manimatik</h1>
        <p class="aciklama">Annenin adını yaz, 100 farklı Anneler Günü cümlesinden birini kap!</p>
        <p class="link"><a href="index.html">← Ana Manimatik sayfasına dön</a></p>

        <input type="text" id="isimInput" placeholder="Annenizin adı nedir?" autocomplete="off">
        <button onclick="cumleUret()">Anneler Günü Cümlesi Göster</button>

        <div id="sonucKutusu"></div>
    </div>

        function cumleUret() {
            const isimInput = document.getElementById('isimInput');
            const sonucKutusu = document.getElementById('sonucKutusu');
            const isim = isimInput.value.trim();

            if (isim === "") {
                alert("Lütfen önce annenizin adını yazın!");
                return;
            }

            const index = Math.floor(Math.random() * annelerGunuCumleleri.length);
            const secilenCumle = annelerGunuCumleleri[index];
            const islenmisCumle = secilenCumle.replace(/\[ISIM\]/g, isim.toLocaleUpperCase('tr-TR'));

            sonucKutusu.innerText = islenmisCumle;
            sonucKutusu.style.display = "block";
        }

        document.getElementById("isimInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                cumleUret();
            }
        });

</html>
